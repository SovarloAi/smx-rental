# LOKALE ONTWIKKELING — dit bestand wordt NIET door Cloudflare Pages gelezen.
#
# Pages leest alleen `wrangler.toml` / `wrangler.jsonc` in de projectroot. Door
# deze bewust `wrangler.dev.toml` te noemen, blijft de bestaande, in het
# dashboard ingestelde deploy-configuratie van de live site volledig ongemoeid.
#
# Gebruik:
#   npm run dev              → next dev met lokale D1 + R2 (miniflare)
#   npm run db:migrate       → migraties op de lokale database
#   npm run db:migrate:prod  → migraties op de echte database in Cloudflare
#
# De productie-bindings (DB, BESTANDEN) en secrets staan in het Pages-dashboard
# onder Settings → Bindings en Settings → Environment variables.

# De Pages-productieconfiguratie heet "smx-rental" en staat in het dashboard;
# deze naam geldt alleen voor de lokale miniflare-sessie.
name = "smx-rental-lokaal"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "smx-contracten"
# Alleen gebruikt bij `--remote`; lokaal maakt miniflare zijn eigen bestand.
# Een D1-id is geen geheim: er is altijd accountauthenticatie voor nodig.
database_id = "0cbd3a14-16d1-4cbd-8cb7-17b257d1c223"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BESTANDEN"
bucket_name = "smx-contracten-bestanden"
# De bucket staat in de EU-jurisdictie: handtekeningen en getekende contracten
# zijn persoonsgegevens en blijven zo binnen de EU. Deze vlag moet overal
# meegegeven worden, ook bij de binding in het Pages-dashboard.
jurisdiction = "eu"

[vars]
CONTRACT_BASIS_URL = "http://localhost:3001"
# CF_ACCESS_TEAM_DOMAIN en CF_ACCESS_AUD staan lokaal in .dev.vars (niet in git).
