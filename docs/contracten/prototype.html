<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMX Rental – Contracten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F6F2EA; --ink:#1F1D1A; --muted:#5F5A52; --line:#E2DACB;
  --sand:#CBB897; --sand-deep:#7D6844; --ok:#2E6A4D; --ok-bg:#E5EFE9;
  --warn:#80540F; --warn-bg:#F6ECD8; --info:#36547A; --info-bg:#E6ECF4; --err:#A0372A; --err-bg:#F8E5E1;
  --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --surface:#211F1B; --ink:#F1ECE3; --muted:#B6AFA3; --line:#3A362F;
    --sand:#CBB897; --sand-deep:#D8C7A3; --ok:#8FCCA9; --ok-bg:#1E3329;
    --warn:#E5BF7A; --warn-bg:#352A17; --info:#A9C1E2; --info-bg:#1E2836; --err:#F0A193; --err-bg:#3A1F1A;
    --btn-ink:#161512;
  }
}
:root[data-theme="dark"]{
  --bg:#161512; --surface:#211F1B; --ink:#F1ECE3; --muted:#B6AFA3; --line:#3A362F;
  --sand:#CBB897; --sand-deep:#D8C7A3; --ok:#8FCCA9; --ok-bg:#1E3329;
  --warn:#E5BF7A; --warn-bg:#352A17; --info:#A9C1E2; --info-bg:#1E2836; --err:#F0A193; --err-bg:#3A1F1A;
  --btn-ink:#161512;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:Jost,"Trebuchet MS",system-ui,sans-serif;font-weight:600;line-height:1.2;margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sand-deep);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.demo{background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.demo .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.demo button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:0}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.mark{font-family:Jost,sans-serif;font-weight:700;font-size:22px;letter-spacing:.04em;text-decoration:none}
.mark small{display:block;font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px}
nav a[aria-current="page"]{background:var(--ink);color:var(--btn-ink)}
main{padding:28px 0 64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--btn-ink);padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sand{background:var(--sand);border-color:var(--sand);color:#1F1D1A}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.s-concept{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.s-verstuurd{background:var(--info-bg);color:var(--info)}
.s-geopend{background:var(--warn-bg);color:var(--warn)}
.s-ondertekend{background:var(--sand);color:#1F1D1A}
.s-goedgekeurd{background:var(--ok-bg);color:var(--ok)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sand);color:#1F1D1A;padding:14px 18px;border-radius:12px;margin-bottom:22px;font-weight:700}
.banner .btn{background:#1F1D1A;border-color:#1F1D1A;color:#fff}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0 28px}
.todo div{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.todo strong{font-family:Jost,sans-serif;font-size:30px;display:block;line-height:1.1}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1.6fr 1.3fr .7fr auto;gap:14px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.item:hover{background:var(--surface)}
.item .name{font-weight:700}
@media (max-width:640px){.item{grid-template-columns:1fr auto}.item .hide-s{display:none}}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
fieldset{border:0;border-top:1px solid var(--line);padding:22px 0 8px;margin:0}
legend{font-family:Jost,sans-serif;font-weight:600;font-size:20px;padding:0 0 10px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:15px}
label.f span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{border-color:var(--sand-deep)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.opt label{display:flex;gap:12px;align-items:center;font-weight:700;cursor:pointer}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.opt input[type=number]{width:90px}
.totalbar{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--ink);margin-top:20px;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.totalbar .sum{font-family:Jost,sans-serif;font-size:26px;font-weight:700}
.detail{display:grid;grid-template-columns:1fr 300px;gap:32px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 18px 30px}
.steps li::before{content:"";position:absolute;left:6px;top:7px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li::after{content:"";position:absolute;left:12px;top:22px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps small{display:block;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.audit{font-size:14px;color:var(--muted);word-break:break-all}
table.lines{width:100%;border-collapse:collapse}
table.lines td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.lines td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
table.lines tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;font-size:19px;padding-top:12px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:560px){.sigs{grid-template-columns:1fr}}
.sigs img{max-width:100%;height:90px;object-fit:contain;display:block;background:#fff;border-radius:6px}
.modal-back{position:fixed;inset:0;background:rgba(20,18,15,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--bg);border-radius:14px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal pre{white-space:pre-wrap;background:var(--surface);padding:14px;border-radius:10px;font-family:inherit;font-size:15px;margin:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--btn-ink);padding:12px 18px;border-radius:10px;font-weight:700;z-index:30}

/* ---------- Klantweergave ---------- */
body.klant{font-size:19px}
.k{max-width:680px;margin:0 auto;padding:0 20px}
.k-head{padding:26px 0 8px;border-bottom:3px solid var(--sand)}
.k-head .mark{font-size:26px}
.k h1{font-size:32px;margin:26px 0 10px}
.k .lead{font-size:20px;margin:0 0 22px}
.k-steps{display:flex;gap:8px;margin:0 0 26px;padding:0;list-style:none;counter-reset:s}
.k-steps li{flex:1;background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:700;counter-increment:s}
.k-steps li::before{content:counter(s) ". "}
.k section{margin:0 0 30px}
.k h2{font-size:24px;margin:0 0 12px}
.facts{background:var(--surface);border-radius:14px;padding:20px}
.facts dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}
details.art{border-bottom:1px solid var(--line)}
details.art summary{cursor:pointer;padding:16px 4px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.art summary::-webkit-details-marker{display:none}
details.art summary::after{content:"+";font-family:Jost,sans-serif;font-size:26px;line-height:1}
details.art[open] summary::after{content:"–"}
details.art ol{margin:0 0 16px;padding-left:26px}
details.art li{margin-bottom:8px}
.check{display:flex;gap:14px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px;cursor:pointer}
.check input{width:30px;height:30px;flex:none;margin:0;accent-color:var(--ink)}
.check:has(input:checked){border-color:var(--ink)}
.k label.f{font-size:18px}
.k input[type=text],.k input[type=email],.k input[type=tel]{font-size:20px;padding:14px}
.pad-wrap{border:2px dashed var(--sand-deep);border-radius:14px;background:#fff;position:relative;touch-action:none}
.pad-wrap canvas{display:block;width:100%;height:220px;border-radius:12px;cursor:crosshair}
.pad-wrap .ph{position:absolute;inset:auto 0 22px 0;text-align:center;color:#8a8478;pointer-events:none;font-size:17px}
.pad-wrap .line{position:absolute;left:24px;right:24px;bottom:56px;border-bottom:1.5px solid #cfc6b6;pointer-events:none}
.bigbtn{width:100%;min-height:68px;font-size:22px;border-radius:14px}
.errbox{background:var(--err-bg);color:var(--err);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-weight:700}
.errbox ul{margin:6px 0 0;padding-left:22px;font-weight:400}
.thanks{text-align:center;padding:40px 0}
.thanks svg{width:84px;height:84px}
.doc{max-width:760px;margin:0 auto;padding:0 20px}
.doc h1{font-size:28px;margin:24px 0 4px}
.doc h3{font-size:18px;margin:18px 0 6px}
.doc ol{padding-left:24px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
(function(){
"use strict";
const OWNER_WA = "31620651528";
const P = {tent:550, extraDag:75, verlichting:30, zijwand:50, zijwandDag:10, klinkers:75, shotjesbar:380};
const KEY = "smx-contract-demo-v1";

const VOORWAARDEN = [
 ["Toepasselijkheid",["Deze voorwaarden gelden voor alle verhuur door SMX Rental (“verhuurder”) aan de persoon die de huurovereenkomst ondertekent (“huurder”).","Afwijkende afspraken gelden alleen als ze onder “Bijzondere afspraken” in de huurovereenkomst staan."]],
 ["Het gehuurde",["Verhuurder verhuurt de producten die in de huurovereenkomst staan, inclusief de benodigde bevestigingsmaterialen.","Op- en afbouw van de stretchtent gebeuren altijd door verhuurder, op de tijden uit de huurovereenkomst.","Het is de huurder niet toegestaan de tent te verplaatsen of het gehuurde onder te verhuren of aan derden mee te geven. Het nalopen en aanspannen van de spanlijnen is wel toegestaan, zoals beschreven in artikel 6.4."]],
 ["Locatie en ondergrond",["De tent heeft inclusief spandraden ongeveer 10,5 × 13 meter vrije ruimte nodig. De huurder zorgt dat deze ruimte op het afgesproken tijdstip vrij en bereikbaar is.","De huurder stuurt bij de aanvraag een foto van de plaatsingslocatie, zodat verhuurder vooraf kan beoordelen of opbouw mogelijk is.","De tent is standaard bedoeld voor plaatsing op gras. Plaatsing op klinkers of andere bestrating is alleen mogelijk na vooraf gemaakte afspraken. Daarbij kan het nodig zijn enkele klinkers tijdelijk te verwijderen voor het plaatsen van haringen. Vanwege de extra opbouwtijd geldt hiervoor een toeslag van € 75.","Bij aankomst beoordeelt verhuurder de ondergrond. Is deze te nat, onstabiel of om een andere reden ongeschikt, dan kan verhuurder de opbouw weigeren. Verhuurder is in dat geval niet aansprakelijk voor het niet kunnen plaatsen van de tent. De huurder is dan alleen de transportkosten verschuldigd."]],
 ["Kabels en leidingen",["De huurder is verplicht vóór de opbouw aan te geven waar zich kabels en leidingen (zoals stroom, water, gas, glasvezel en riolering) in de grond bevinden.","Verhuurder is niet aansprakelijk voor schade aan kabels of leidingen die niet of onjuist zijn doorgegeven. Deze schade en de gevolgen daarvan komen voor rekening van de huurder."]],
 ["Gebruik en verboden",["De huurder gebruikt het gehuurde zorgvuldig en volgens de aanwijzingen van verhuurder.","Open vuur, vuurkorven, barbecues en andere ontvlambare warmtebronnen zijn in of nabij de tent ten strengste verboden.","Rookbommen, champagne spuiten, schuim, kleurpoeder, glitter en andere middelen die de tent kunnen vervuilen of beschadigen zijn ten strengste verboden.","Schade of vervuiling door overtreding van dit artikel komt volledig voor rekening van de huurder."]],
 ["Weer en veiligheid",["De stretchtent is een tijdelijke overkapping. De tent is niet bestand tegen extreme weersomstandigheden, zoals storm (windkracht 6 of hoger), zware regenval of sneeuwbelasting.","Verhuurder is tijdens het feest niet op locatie en het weer kan lokaal sterk verschillen. De huurder beoordeelt daarom zelf ter plaatse wanneer het onveilig wordt en is verantwoordelijk voor het tijdig ontruimen van de tent, zowel personen als spullen.","Bij (dreigend) gevaarlijk weer belt de huurder direct verhuurder op 06 20 65 15 28, zodat verhuurder maatregelen kan nemen.","De huurder breekt de tent nooit zelf af. De huurder mag de spanlijnen nalopen en een slappe spanlijn met de spanner bijstellen, maar alleen als dit veilig kan en de huurder weet hoe dit moet. Twijfelt de huurder, dan laat hij de tent ongemoeid en belt hij verhuurder. Schade door ondeskundig aanpassen van de tent komt voor rekening van de huurder.","Schade aan het gehuurde door plotseling opkomende extreme weersomstandigheden komt niet voor rekening van de huurder, mits de huurder zich aan dit artikel heeft gehouden. Heeft de huurder de tent niet tijdig ontruimd of verhuurder niet gewaarschuwd, dan is de huurder aansprakelijk voor de schade.","Een slechte weersverwachting is geen reden voor kosteloze annulering buiten de termijnen van artikel 9."]],
 ["Schade, vervuiling en reinigingskosten",["De huurder is vanaf de opbouw tot en met de afbouw verantwoordelijk voor het gehuurde en levert het terug in de staat waarin het is ontvangen.","Normale gebruikssporen, zoals licht vuil, gras of regenwater, worden niet in rekening gebracht.","Is het tentdoek of zijn de zijwanden vervuild door bijvoorbeeld drank, eten, vet, rook, roet, kleurpoeder of verf, of bovenmatig vervuild door natuurlijke stoffen zoals veel modder of boomhars, dan worden de reinigingskosten aan de huurder doorberekend. De reinigingskosten worden achteraf vastgesteld op basis van de werkelijke kosten.","Schade aan het gehuurde door onzorgvuldig gebruik, waaronder defecte verlichting, gescheurd tentdoek, beschadigde zijwanden en ontbrekende of beschadigde materialen, komt voor rekening van de huurder. De huurder betaalt de reparatiekosten, of bij onherstelbare schade of verlies de vervangingswaarde.","Verhuurder legt de staat van het gehuurde bij opbouw en afbouw vast met foto’s. De huurder mag daarbij aanwezig zijn.","Reinigings- en schadekosten worden op de factuur van de huurperiode vermeld."]],
 ["Aansprakelijkheid van verhuurder",["Verhuurder bouwt de tent vakkundig op en zorgt dat het gehuurde bij levering in goede staat is.","Verhuurder is niet aansprakelijk voor letsel of schade die ontstaat door gebruik in strijd met deze voorwaarden of de aanwijzingen van verhuurder, of door voortgezet gebruik van de tent bij gevaarlijke weersomstandigheden.","Verhuurder is niet aansprakelijk voor gevolgschade, zoals een feest dat (deels) niet door kan gaan.","De aansprakelijkheid van verhuurder is in alle gevallen beperkt tot het bedrag dat de verzekering van verhuurder uitkeert, of, als er geen uitkering plaatsvindt, tot het totale huurbedrag uit de huurovereenkomst.","De beperkingen in dit artikel gelden niet bij opzet of grove schuld van verhuurder."]],
 ["Annulering",["De huurder annuleert per e-mail, WhatsApp of telefoon. De datum waarop de huurder contact opneemt, geldt als annuleringsdatum. Bij een telefonische annulering stuurt verhuurder een bevestiging per e-mail of WhatsApp.","Annulering meer dan 14 dagen voor de opbouwdatum is kosteloos.","Bij annulering binnen 14 dagen voor de opbouwdatum is de huurder 25% van het totale huurbedrag verschuldigd.","Bij annulering binnen 7 dagen voor de opbouwdatum is de huurder 50% van het totale huurbedrag verschuldigd.","Bij annulering binnen 48 uur voor de opbouwdatum is de huurder 75% van het totale huurbedrag verschuldigd.","Kan verhuurder door overmacht (zoals ziekte, schade aan de tent of pech onderweg) niet leveren, dan is de huurder niets verschuldigd. Verhuurder probeert in overleg een andere datum te vinden, maar is niet aansprakelijk voor verdere schade."]],
 ["Afbouw en natte tent",["De huurder zorgt dat verhuurder op het afgesproken afbouwmoment toegang heeft tot de locatie.","Is de tent bij afbouw nog nat, dan blijft deze staan tot het tentdoek voldoende is opgedroogd. Hiervoor worden geen extra dagen in rekening gebracht.","Tot de afbouw blijft de huurder verantwoordelijk voor de tent volgens artikel 6 en 7."]],
 ["Betaling",["De huurder ontvangt na afloop van de huurperiode een factuur en betaalt binnen 14 dagen na factuurdatum.","SMX Rental valt onder de kleineondernemersregeling (KOR) en brengt geen btw in rekening.","Bij te late betaling stuurt verhuurder een herinnering. Blijft betaling daarna uit, dan kan verhuurder wettelijke rente en incassokosten in rekening brengen."]],
 ["Privacy",["Verhuurder gebruikt de gegevens van de huurder alleen voor het uitvoeren van de huurovereenkomst en de administratie. De gegevens worden niet aan derden verstrekt en niet langer bewaard dan wettelijk verplicht."]],
 ["Toepasselijk recht",["Op de huurovereenkomst en deze voorwaarden is Nederlands recht van toepassing."]]
];
const CHECKS = [
 "Ik heb de Algemene Huurvoorwaarden van SMX Rental gelezen en ga ermee akkoord.",
 "Ik heb doorgegeven waar kabels en leidingen in de grond liggen, of er zijn mij op de plaatsingslocatie geen kabels of leidingen bekend.",
 "De gegevens in deze overeenkomst zijn juist."
];

/* ---------- opslag ---------- */
function today(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.toISOString().slice(0,10)}
function uid(){return Math.random().toString(36).slice(2,10)}
function seed(){
  const now=new Date().toISOString();
  return {owner:null,contracts:[
    {id:uid(),token:uid()+uid(),status:"verstuurd",createdAt:now,sentAt:now,klant:{naam:"Anouk Peeters",adres:"Kerkstraat 12",postcode:"6086 AB Neer",telefoon:"06 12345678",email:"anouk@voorbeeld.nl"},plaatsingsadres:"",opbouwDatum:"2027-05-14",opbouwTijd:"19:00",feestDatum:"2027-05-15",afbouwDatum:"2027-05-16",afbouwTijd:"11:00",extraDagen:0,verlichting:true,zijwanden:2,klinkers:false,shotjesbar:false,transport:25,afspraken:""},
    {id:uid(),token:uid()+uid(),status:"concept",createdAt:now,klant:{naam:"Henk Willems",adres:"Molenweg 3",postcode:"6093 CD Heythuysen",telefoon:"06 87654321",email:""},plaatsingsadres:"",opbouwDatum:"2027-06-11",opbouwTijd:"19:00",feestDatum:"2027-06-12",afbouwDatum:"2027-06-14",afbouwTijd:"11:00",extraDagen:1,verlichting:true,zijwanden:1,klinkers:true,shotjesbar:true,transport:40,afspraken:"Plaatsing op de oprit (klinkers), in overleg twee klinkers per hoek verwijderen."}
  ]};
}
let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
window.addEventListener("storage",e=>{if(e.key===KEY){load();route()}});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function eur(n){return "€ "+Number(n||0).toLocaleString("nl-NL",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function dLong(d){if(!d)return "–";return new Date(d+"T12:00").toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function dShort(d){if(!d)return "–";return new Date(d+"T12:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"})}
function ts(iso){if(!iso)return "";return new Date(iso).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function first(n){return (n||"").split(" ")[0]}
function waNum(t){let d=(t||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="31"+d.slice(1);return d}
function base(){return location.href.split("#")[0]}
function byId(id){return S.contracts.find(c=>c.id===id)}
function byToken(t){return S.contracts.find(c=>c.token===t)}
const STATUS={concept:"Concept",verstuurd:"Verstuurd",geopend:"Geopend",ondertekend:"Ondertekend",goedgekeurd:"Goedgekeurd"};
function pill(c){return `<span class="pill s-${c.status}">${STATUS[c.status]}${c.paper?" (papier)":""}</span>`}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function calc(c){
  const L=[]; const n=+c.extraDagen||0, z=+c.zijwanden||0;
  L.push(["Stretchtent 7,5 × 10 m","Weekendtarief, incl. bevestigingsmaterialen, op- en afbouw",P.tent]);
  if(n>0)L.push([`Extra huurdag${n>1?"en":""}`,`${n} × ${eur(P.extraDag)}`,n*P.extraDag]);
  if(c.verlichting)L.push(["Sfeerverlichting",n>0?"Per weekend, extra dagen gratis":"Voor de gehele tent, per weekend",P.verlichting]);
  if(z>0)L.push([`Zijwand${z>1?"en":""} 10 m`,`${z} × ${eur(P.zijwand)}`+(n>0?` + ${z} × ${n} extra dag × ${eur(P.zijwandDag)}`:""),z*P.zijwand+z*n*P.zijwandDag]);
  if(c.klinkers)L.push(["Toeslag klinkers of bestrating","Extra opbouwtijd",P.klinkers]);
  if(c.shotjesbar)L.push(["Shotjesbar","Per weekend; de flessen blijven na de huur van u",P.shotjesbar]);
  if(+c.transport>0)L.push(["Transportkosten","Volgens berekening",+c.transport]);
  return {lines:L,total:L.reduce((a,l)=>a+l[2],0)};
}
function linesTable(c){
  const r=calc(c);
  return `<table class="lines">${r.lines.map(l=>`<tr><td><strong>${esc(l[0])}</strong><br><span class="muted">${esc(l[1])}</span></td><td>${eur(l[2])}</td></tr>`).join("")}
  <tr class="tot"><td>Totaal <span class="muted" style="font-weight:400;font-size:15px">(geen btw, KOR)</span></td><td>${eur(r.total)}</td></tr></table>`;
}
async function hashOf(c){
  const payload=JSON.stringify({k:c.klant,p:c.plaatsingsadres,o:[c.opbouwDatum,c.opbouwTijd,c.feestDatum,c.afbouwDatum,c.afbouwTijd],r:calc(c),a:c.afspraken,v:VOORWAARDEN});
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(payload));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "niet beschikbaar"}
}

/* ---------- handtekeningvak ---------- */
function pad(canvas,onChange){
  const ctx=canvas.getContext("2d"); let drawing=false, dirty=false, last=null;
  function size(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const img=dirty?canvas.toDataURL():null;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1F1D1A";if(img){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0,r.width,r.height);i.src=img}}
  size(); window.addEventListener("resize",size);
  function pt(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,7);ctx.fillStyle="#1F1D1A";ctx.fill()});
  canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!dirty){dirty=true;onChange&&onChange(true)}});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>canvas.addEventListener(ev,()=>{drawing=false}));
  return {clear(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false;onChange&&onChange(false)},empty(){return !dirty},data(){return canvas.toDataURL("image/png")}};
}

/* ---------- modals ---------- */
function modal(html){$("#layer").innerHTML=`<div class="modal-back" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;const b=$(".modal-back");b.addEventListener("click",e=>{if(e.target===b)closeModal()});return b}
function closeModal(){$("#layer").innerHTML=""}

function sendModal(c,kind){
  const link=base()+(kind==="final"?"#/contract/":"#/teken/")+c.token;
  const txt = kind==="final"
   ? `Goedendag ${first(c.klant.naam)},\n\nHartelijk dank voor het ondertekenen. Hierbij het definitieve, door beide partijen ondertekende huurcontract voor ${dLong(c.feestDatum)}:\n${link}\n\nMet vriendelijke groet,\nSjors – SMX Rental`
   : kind==="reminder"
   ? `Goedendag ${first(c.klant.naam)},\n\nEen vriendelijke herinnering: het huurcontract voor de stretchtent op ${dLong(c.feestDatum)} staat nog voor u klaar. Ondertekenen kan via deze link:\n${link}\n\nVragen? Bel of app gerust.\n\nMet vriendelijke groet,\nSjors – SMX Rental`
   : `Goedendag ${first(c.klant.naam)},\n\nHierbij ontvangt u de huurovereenkomst voor de stretchtent op ${dLong(c.feestDatum)}. Via onderstaande link kunt u alles rustig doorlezen en digitaal ondertekenen:\n${link}\n\nMet vriendelijke groet,\nSjors – SMX Rental`;
  const wa=`https://wa.me/${waNum(c.klant.telefoon)}?text=${encodeURIComponent(txt)}`;
  const title=kind==="final"?"Definitief contract sturen":kind==="reminder"?"Herinnering sturen":"Contract versturen";
  modal(`<h2>${title}</h2><p class="muted">Dit bericht gaat vanuit uw eigen WhatsApp naar ${esc(c.klant.naam)} (${esc(c.klant.telefoon)}).</p><pre>${esc(txt)}</pre>
  <p class="muted" style="font-size:14px">In deze demo werkt de link alleen op dit apparaat. In de echte versie staat hij op smxrental.com en gaat er ook een e-mail mee.</p>
  <div class="row"><a class="btn" id="m-wa" href="${wa}" target="_blank" rel="noopener">Openen in WhatsApp</a><button class="btn ghost" id="m-copy">Kopieer bericht</button><button class="btn ghost" id="m-close">Sluiten</button></div>`);
  const done=()=>{if(kind==="send"&&c.status==="concept"){c.status="verstuurd";c.sentAt=new Date().toISOString();save()}if(kind==="reminder"){c.remindedAt=new Date().toISOString();save()}};
  $("#m-wa").onclick=()=>{done();setTimeout(()=>{closeModal();route()},300)};
  $("#m-copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast("Bericht gekopieerd")).catch(()=>{});done();};
  $("#m-close").onclick=()=>{closeModal();route()};
}

function ownerSigModal(after){
  modal(`<h2>Uw handtekening</h2><p class="muted">Eén keer zetten; daarna wordt hij bij elke goedkeuring automatisch toegevoegd.</p>
  <div class="pad-wrap"><canvas id="opad"></canvas><div class="line"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="o-save" disabled>Handtekening opslaan</button><button class="btn ghost" id="o-clr">Opnieuw</button><button class="btn ghost" id="o-cancel">Annuleren</button></div>`);
  const p=pad($("#opad"),has=>{$("#o-save").disabled=!has});
  $("#o-clr").onclick=()=>p.clear();
  $("#o-cancel").onclick=closeModal;
  $("#o-save").onclick=()=>{S.owner=p.data();save();closeModal();toast("Handtekening opgeslagen");after&&after()};
}

/* ---------- beheer: layout ---------- */
function adminShell(active,inner){
  document.body.classList.remove("klant");
  return `<div class="demo"><div class="wrap"><span>Demo: alles blijft alleen in deze browser bewaard.</span><span class="row"><button id="sig-btn">${S.owner?"Handtekening wijzigen":"Handtekening instellen"}</button><button id="reset">Demo opnieuw beginnen</button></span></div></div>
  <header class="top"><div class="wrap"><a class="mark" href="#/">SMX RENTAL<small>Contracten</small></a>
  <nav><a href="#/" ${active==="o"?'aria-current="page"':""}>Overzicht</a><a href="#/nieuw" ${active==="n"?'aria-current="page"':""}>Nieuw contract</a></nav></div></header>
  <main><div class="wrap">${inner}</div></main>`;
}
function bindShell(){
  $("#reset").onclick=()=>{if(confirm("Alle demogegevens wissen en opnieuw beginnen?")){S=seed();save();location.hash="#/";route()}};
  $("#sig-btn").onclick=()=>ownerSigModal(route);
}

  const cs=[...S.contracts].sort((a,b)=>(a.feestDatum||"").localeCompare(b.feestDatum||""));

  <div class="row" style="justify-content:space-between"><h1 style="font-size:30px">Overzicht</h1><a class="btn" href="#/nieuw">Nieuw contract</a></div>
  <div class="todo"><div><strong>${keuren}</strong>Te keuren</div><div><strong>${wacht}</strong>Wacht op handtekening</div><div><strong>${conc}</strong>Concept</div><div><strong>${klaar}</strong>Rond</div></div>

  const ex=id?byId(id):null;
  if(ex&&(ex.status==="ondertekend"||ex.status==="goedgekeurd")){location.hash="#/c/"+id;return}
  const c=ex?JSON.parse(JSON.stringify(ex)):{klant:{naam:"",adres:"",postcode:"",telefoon:"",email:""},plaatsingsadres:"",opbouwDatum:"",opbouwTijd:"19:00",feestDatum:"",afbouwDatum:"",afbouwTijd:"11:00",extraDagen:0,verlichting:false,zijwanden:0,klinkers:false,shotjesbar:false,transport:0,afspraken:""};

  </div></fieldset>
  <fieldset><legend>Data en tijden</legend><div class="grid">
   <label class="f">Datum feest<input type="date" name="feestDatum" value="${v(c.feestDatum)}" required></label>
   <span></span>
   <label class="f">Opbouw datum<input type="date" name="opbouwDatum" value="${v(c.opbouwDatum)}"></label>
   <label class="f">Opbouw tijd<input type="time" name="opbouwTijd" value="${v(c.opbouwTijd)}"></label>
   <label class="f">Afbouw datum<input type="date" name="afbouwDatum" value="${v(c.afbouwDatum)}"></label>
   <label class="f">Afbouw tijd<input type="time" name="afbouwTijd" value="${v(c.afbouwTijd)}"></label>
  </div><p class="muted" style="font-size:14px">Tip: vult u eerst de feestdatum in, dan worden opbouw (dag ervoor) en afbouw (dag erna) automatisch gezet.</p></fieldset>
  <fieldset><legend>Wat huurt de klant?</legend>
   <div class="opt"><label><input type="checkbox" checked disabled> Stretchtent 7,5 × 10 m</label><span>${eur(P.tent)}</span></div>
   <div class="opt"><label for="extraDagen">Extra huurdagen <span class="muted" style="font-weight:400">(${eur(P.extraDag)} per dag)</span></label><input type="number" id="extraDagen" name="extraDagen" min="0" max="7" value="${+c.extraDagen||0}"></div>
   <div class="opt"><label><input type="checkbox" name="verlichting" ${c.verlichting?"checked":""}> Sfeerverlichting <span class="muted" style="font-weight:400">(extra dagen gratis)</span></label><span>${eur(P.verlichting)}</span></div>
   <div class="opt"><label for="zijwanden">Zijwanden 10 m <span class="muted" style="font-weight:400">(${eur(P.zijwand)} per stuk, ${eur(P.zijwandDag)} per extra dag, max. 2)</span></label><input type="number" id="zijwanden" name="zijwanden" min="0" max="2" value="${+c.zijwanden||0}"></div>
   <div class="opt"><label><input type="checkbox" name="klinkers" ${c.klinkers?"checked":""}> Toeslag klinkers of bestrating</label><span>${eur(P.klinkers)}</span></div>
   <div class="opt"><label><input type="checkbox" name="shotjesbar" ${c.shotjesbar?"checked":""}> Shotjesbar</label><span>${eur(P.shotjesbar)}</span></div>
   <div class="opt"><label for="transport">Transportkosten <span class="muted" style="font-weight:400">(uit de calculator)</span></label><input type="number" id="transport" name="transport" min="0" step="1" value="${+c.transport||0}"></div>
  </fieldset>
  <fieldset><legend>Bijzondere afspraken</legend>
   <label class="f"><span class="hint">Bijvoorbeeld plaatsing op klinkers of afwijkende tijden. Laat leeg als er niets bijzonders is.</span><textarea name="afspraken" rows="3">${v(c.afspraken)}</textarea></label>

    const g=n=>f.elements[n];

    ["feestDatum","opbouwDatum","opbouwTijd","afbouwDatum","afbouwTijd"].forEach(k=>c[k]=g(k).value);

  });
  function persist(){
    read();
    const miss=[];
    if(!c.klant.naam)miss.push("naam van de klant");

  </aside></div>`;
  $("#root").innerHTML=adminShell("",html); bindShell();
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=ev=>{ev.preventDefault();f()}};
  on("#a-send",()=>sendModal(c,"send"));
  on("#a-rem",()=>sendModal(c,"reminder"));
  on("#a-final",()=>sendModal(c,"final"));
  on("#a-paper",()=>{if(confirm("Markeren als op papier ondertekend? Dit contract gaat dan naar 'Ondertekend'.")){c.paper=true;c.status="ondertekend";c.signedAt=new Date().toISOString();c.seen=true;save();route()}});
  on("#a-ok",()=>{const go=()=>{c.status="goedgekeurd";c.approvedAt=new Date().toISOString();save();route();toast("Goedgekeurd. In de echte versie gaat de PDF nu naar u en de klant.")};if(!S.owner)ownerSigModal(go);else go()});
  on("#a-del",()=>{if(confirm("Dit contract definitief verwijderen?")){S.contracts=S.contracts.filter(x=>x.id!==c.id);save();location.hash="#/"}});
}

/* ---------- klant ---------- */
function klantShell(inner,c){
  document.body.classList.add("klant");
  return `<div class="demo"><div class="wrap"><span>Zo ziet de klant het (demo).</span>${c?`<a href="#/c/${c.id}" style="color:var(--muted)">Terug naar beheer</a>`:`<a href="#/" style="color:var(--muted)">Terug naar beheer</a>`}</div></div>
  <div class="k"><div class="k-head"><span class="mark">SMX RENTAL<small>Stretchtent verhuur · Neer</small></span></div>${inner}</div>`;
}
function facts(c){
  return `<div class="facts"><dl>
   <dt>Opbouw</dt><dd>${dLong(c.opbouwDatum)}, ${esc(c.opbouwTijd)} uur</dd>
   <dt>Uw feest</dt><dd>${dLong(c.feestDatum)}</dd>
   <dt>Afbouw</dt><dd>${dLong(c.afbouwDatum)}, ${esc(c.afbouwTijd)} uur</dd>
   <dt>Adres</dt><dd>${esc(c.plaatsingsadres||[c.klant.adres,c.klant.postcode].filter(Boolean).join(", "))}</dd>
  </dl>${linesTable(c)}
  <p style="margin:14px 0 0">U betaalt pas na afloop, via een factuur.</p>
  ${c.afspraken?`<p style="margin:10px 0 0"><strong>Bijzondere afspraken:</strong> ${esc(c.afspraken)}</p>`:""}</div>`;
}
function viewSign(token){
  const c=byToken(token);
  if(!c){$("#root").innerHTML=klantShell(`<h1>Dit contract is niet gevonden</h1><p class="lead">Controleer de link of neem contact op met SMX Rental via 06 20 65 15 28.</p>`);return}
  if(c.status==="ondertekend"||c.status==="goedgekeurd"){viewThanks(c);return}
  if(c.status==="verstuurd"||c.status==="concept"){if(c.status==="verstuurd"){c.status="geopend";c.openedAt=new Date().toISOString();save()}}
  const html=`<h1>Goedendag ${esc(first(c.klant.naam))},</h1>
  <p class="lead">Hieronder vindt u de huurovereenkomst voor de stretchtent. Lees alles rustig door en zet onderaan uw handtekening. Dit duurt ongeveer vijf minuten.</p>
  <ol class="k-steps"><li>Controleren</li><li>Lezen</li><li>Ondertekenen</li></ol>
  <section><h2>Uw huur in het kort</h2>${facts(c)}</section>
  <section><h2>Uw gegevens</h2><p style="margin-top:0">Klopt dit? Pas het gerust aan.</p>
   <div style="display:grid;gap:14px">
    <label class="f">Telefoonnummer<input type="tel" id="k-tel" value="${esc(c.klant.telefoon)}"></label>
    <label class="f">E-mailadres <span class="hint" style="font-weight:400;color:var(--muted)">hierop ontvangt u het contract</span><input type="email" id="k-mail" value="${esc(c.klant.email)}"></label>
   </div></section>
  <section><h2>Huurvoorwaarden</h2><p style="margin-top:0">Tik op een onderdeel om het te openen.</p>
   ${VOORWAARDEN.map((a,i)=>`<details class="art"><summary>${i+1}. ${esc(a[0])}</summary><ol>${a[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`).join("")}
  </section>
  <section id="sign"><h2>Ondertekenen</h2>
   ${CHECKS.map((t,i)=>`<label class="check"><input type="checkbox" id="ck${i}"><span>${esc(t)}</span></label>`).join("")}
   <div style="display:grid;gap:14px;margin:18px 0">
    <label class="f">Uw volledige naam<input type="text" id="k-naam" value="${esc(c.klant.naam)}" autocomplete="name"></label>
    <label class="f">Plaats<input type="text" id="k-plaats" value="${esc((c.klant.postcode||"").replace(/^[0-9]{4}\s?[A-Za-z]{2}\s*/,""))}"></label>
   </div>
   <p style="margin:0 0 8px;font-weight:700">Zet hieronder uw handtekening met uw vinger of muis</p>
   <div class="pad-wrap"><canvas id="kpad" aria-label="Handtekeningvak"></canvas><div class="line"></div><div class="ph" id="ph">Teken hier</div></div>
   <p style="margin:8px 0 22px"><button class="btn ghost" id="k-clr">Handtekening opnieuw zetten</button></p>
   <div id="kerr"></div>
   <button class="btn bigbtn" id="k-go">Contract ondertekenen</button>
   <p class="muted" style="font-size:16px;text-align:center">Vragen? Bel of app Sjors: 06 20 65 15 28</p>
  </section>`;
  $("#root").innerHTML=klantShell(html,c);
  window.scrollTo(0,0);
  const p=pad($("#kpad"),has=>{$("#ph").style.display=has?"none":"block"});
  $("#k-clr").onclick=()=>p.clear();
  $("#k-go").onclick=async()=>{
    const miss=[];
    CHECKS.forEach((t,i)=>{if(!$("#ck"+i).checked)miss.push(["Vink aan: ",t])});
    const naam=$("#k-naam").value.trim(), plaats=$("#k-plaats").value.trim();
    if(!naam)miss.push(["","Vul uw naam in."]);
    if(!plaats)miss.push(["","Vul de plaats in."]);
    if(p.empty())miss.push(["","Zet uw handtekening in het vak."]);
    if(miss.length){$("#kerr").innerHTML=`<div class="errbox">Nog niet alles is ingevuld:<ul>${miss.map(m=>`<li>${esc(m[0]+m[1])}</li>`).join("")}</ul></div>`;$("#kerr").scrollIntoView({behavior:"smooth",block:"center"});return}
    $("#k-go").disabled=true;$("#k-go").textContent="Bezig met ondertekenen…";
    c.klant.telefoon=$("#k-tel").value.trim()||c.klant.telefoon;
    c.klant.email=$("#k-mail").value.trim();
    const ua=navigator.userAgent; const dev=/iPhone|iPad/.test(ua)?"iPhone/iPad":/Android/.test(ua)?"Android":/Mac/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Onbekend";
    c.signature={naam,plaats,img:p.data(),ua:dev+" · "+(/Edg/.test(ua)?"Edge":/Chrome/.test(ua)?"Chrome":/Safari/.test(ua)?"Safari":/Firefox/.test(ua)?"Firefox":"browser"),checks:3,hash:await hashOf(c)};
    c.status="ondertekend";c.signedAt=new Date().toISOString();c.seen=false;save();
    viewThanks(c);
  };
}
function viewThanks(c){
  const msg=`Goedendag Sjors, ik heb zojuist het huurcontract voor ${dLong(c.feestDatum)} ondertekend. Groet, ${c.signature?c.signature.naam:c.klant.naam}`;
  const done=c.status==="goedgekeurd";
  const html=`<div class="thanks">
   <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" fill="none" stroke="var(--ok)" stroke-width="4"/><path d="M25 43l11 11 23-25" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <h1 style="margin-top:18px">Bedankt, ${esc(first(c.klant.naam))}</h1>
   <p class="lead">${done?"Uw contract is door beide partijen ondertekend.":"Uw contract is ondertekend. Sjors kijkt het na en daarna ontvangt u het definitieve contract per e-mail."}</p>
   ${done?`<p><a class="btn bigbtn" href="#/contract/${c.token}">Bekijk het definitieve contract</a></p>`:`<p><a class="btn bigbtn" href="https://wa.me/${OWNER_WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Laat het Sjors weten via WhatsApp</a></p>
   <p class="muted" style="font-size:16px">Dit hoeft niet: Sjors krijgt ook automatisch een melding.</p>`}
  </div><section><h2>Uw huur in het kort</h2>${facts(c)}</section>`;
  $("#root").innerHTML=klantShell(html,c); window.scrollTo(0,0);
}
function viewFinal(token){
  const c=byToken(token);
  if(!c||c.status!=="goedgekeurd"){$("#root").innerHTML=klantShell(`<h1>Dit contract is nog niet definitief</h1><p class="lead">U ontvangt bericht zodra het door beide partijen is ondertekend.</p>`,c);return}
  const sig=c.signature;
  const html=`<div class="doc" style="padding:0"><h1>Huurovereenkomst stretchtent</h1>
  <p class="muted" style="margin-top:0">SMX Rental · Engelmanstraat 23, 6086 BA Neer · 06 20 65 15 28 · smxrental@gmail.com · KvK 99015951<br>SMX Rental valt onder de kleineondernemersregeling (KOR); er wordt geen btw berekend.</p>
  <h3>Huurder</h3><p style="margin:0">${esc(c.klant.naam)}<br>${esc(c.klant.adres)}, ${esc(c.klant.postcode)}<br>${esc(c.klant.telefoon)}${c.klant.email?" · "+esc(c.klant.email):""}</p>
  <h3>Huurperiode en producten</h3>${facts(c)}
  <h3>Algemene Huurvoorwaarden</h3>${VOORWAARDEN.map((a,i)=>`<p style="margin:14px 0 4px"><strong>Artikel ${i+1} – ${esc(a[0])}</strong></p><ol>${a[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`).join("")}
  <h3>Ondertekening</h3>
  <div class="sigs"><div><strong>Huurder</strong>${sig?`<img src="${sig.img}" alt="Handtekening huurder"><div class="muted" style="font-size:15px">${esc(sig.naam)}, ${esc(sig.plaats)}, ${new Date(c.signedAt).toLocaleDateString("nl-NL")}</div>`:`<div class="muted">Op papier ondertekend</div>`}</div>
  <div><strong>Verhuurder</strong>${S.owner?`<img src="${S.owner}" alt="Handtekening verhuurder">`:""}<div class="muted" style="font-size:15px">Sjors Dirkx namens SMX Rental, Neer, ${new Date(c.sentAt||c.createdAt).toLocaleDateString("nl-NL")}</div></div></div>
  </div>`;
  $("#root").innerHTML=klantShell(html,c); window.scrollTo(0,0);
}

/* ---------- router ---------- */
function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const m=h.split("/").filter(Boolean);
  closeModal();
  if(m[0]==="teken")return viewSign(m[1]);
  if(m[0]==="contract")return viewFinal(m[1]);
  if(m[0]==="nieuw")return viewEditor(null);
  if(m[0]==="bewerk")return viewEditor(m[1]);
  if(m[0]==="c")return viewDetail(m[1]);
  return viewOverview();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
})();
</script>
</body>
</html>
